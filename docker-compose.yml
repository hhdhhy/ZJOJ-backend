# ZJOJ Docker Compose 配置
version: '3.8'

services:
  # MySQL 数据库
  db:
    image: mysql:8.0
    container_name: zjoj-db
    restart: always
    environment:
      MYSQL_DATABASE: ZJOJ
      MYSQL_USER: zjoj_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-ZJOJ@2024secure}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secure_password}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - zjoj-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "zjoj_user", "-p${DB_PASSWORD:-ZJOJ@2024secure}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Django 后端
  web:
    build: .
    container_name: zjoj-web
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --workers 3 --bind 0.0.0.0:8000 --timeout 120 ZJOJ.wsgi:application"
    volumes:
      - static_volume:/home/zjoj/staticfiles
      - media_volume:/home/zjoj/media
    expose:
      - "8000"
    environment:
      - DB_NAME=ZJOJ
      - DB_USER=zjoj_user
      - DB_PASSWORD=${DB_PASSWORD:-ZJOJ@2024secure}
      - DB_HOST=db
      - DB_PORT=3306
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DJANGO_SETTINGS_MODULE=ZJOJ.settings_production
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
    networks:
      - zjoj-network

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: zjoj-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/home/zjoj/staticfiles:ro
      - media_volume:/home/zjoj/media:ro
    depends_on:
      - web
    networks:
      - zjoj-network

volumes:
  mysql_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

networks:
  zjoj-network:
    driver: bridge
