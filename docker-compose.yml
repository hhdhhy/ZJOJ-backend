# ZJOJ Docker Compose 配置
version: '3.8'

services:
  # Redis 消息队列
  redis:
    image: redis:7-alpine
    container_name: zjoj-redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - zjoj-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # go-judge 评测沙箱服务
  gojudge:
    image: criyle/go-judge:latest
    container_name: zjoj-gojudge
    restart: always
    privileged: true
    shm_size: 256m
    ports:
      - "5050:5050"
    command: ["./go-judge", "-mount-conf", "/opt/mount.yaml"]
    volumes:
      - /tmp:/w
      - /usr:/host-usr:ro
      - /lib:/host-lib:ro
      - /lib64:/host-lib64:ro
      - /bin:/host-bin:ro
      - /etc/ld.so.cache:/host-ld-cache:ro
      - /etc/alternatives:/host-alternatives:ro
      - ./deploy/gojudge-mount.yaml:/opt/mount.yaml:ro
    environment:
      - GO_JUDGE_HTTP_ADDR=0.0.0.0:5050
    networks:
      - zjoj-network

  # MySQL 数据库
  db:
    image: mysql:8.0
    container_name: zjoj-db
    restart: always
    environment:
      MYSQL_DATABASE: ZJOJ
      MYSQL_USER: zjoj_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-ZJOJ@2024secure}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secure_password}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - zjoj-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "zjoj_user", "-p${DB_PASSWORD:-ZJOJ@2024secure}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Django 后端
  web:
    build: .
    container_name: zjoj-web
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --workers 4 --worker-class gevent --threads 2 --bind 0.0.0.0:8000 --timeout 120 --keep-alive 5 ZJOJ.wsgi:application"
    volumes:
      - static_volume:/home/zjoj/staticfiles
      - media_volume:/home/zjoj/media
    expose:
      - "8000"
    environment:
      - DB_NAME=ZJOJ
      - DB_USER=zjoj_user
      - DB_PASSWORD=${DB_PASSWORD:-ZJOJ@2024secure}
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GO_JUDGE_URL=http://gojudge:5050
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DJANGO_SETTINGS_MODULE=ZJOJ.settings_production
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - zjoj-network

  # Celery Worker
  celery:
    build: .
    container_name: zjoj-celery
    restart: always
    command: >
      sh -c "celery -A ZJOJ worker --loglevel=info --concurrency=2"
    volumes:
      - media_volume:/home/zjoj/media
    environment:
      - DB_NAME=ZJOJ
      - DB_USER=zjoj_user
      - DB_PASSWORD=${DB_PASSWORD:-ZJOJ@2024secure}
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GO_JUDGE_URL=http://gojudge:5050
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DJANGO_SETTINGS_MODULE=ZJOJ.settings_production
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - zjoj-network

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: zjoj-nginx
    restart: always
    ports:
      - "8000:80"
      - "8443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/home/zjoj/staticfiles:ro
      - media_volume:/home/zjoj/media:ro
    depends_on:
      - web
    networks:
      - zjoj-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

networks:
  zjoj-network:
    driver: bridge
